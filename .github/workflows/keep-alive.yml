name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # <-- ADD THIS to allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        # The -sS flags make curl silent on success but show errors if it fails
        run: curl -sS https://askscottie.streamlit.app > /dev/null
